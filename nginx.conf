# =============================================================================
# nginx del frontend de GEREO. Sirve archivos estáticos y nada más: todo lo que
# es API lo rutea el balanceador directamente al contenedor del backend, así que
# acá NO hay proxy_pass — un reverse proxy de más sería un salto de red extra y
# un segundo lugar donde se puede romper el ruteo.
# =============================================================================
worker_processes  1;

# El pid va a /tmp y NO a /var/run, aunque el Dockerfile haga chown de esa ruta:
# /var/run es un symlink a /run, y /run lo monta el runtime como un tmpfs NUEVO
# propiedad de root en cada arranque. O sea que el chown del build se pierde y
# nginx muere con `open() "/var/run/nginx.pid" failed (13: Permission denied)`
# apenas termina de leer la configuracion. /tmp sigue siendo escribible para
# cualquier usuario.
pid /tmp/nginx.pid;

events { worker_connections 1024; }

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Log a stdout/stderr: en Fargate lo recoge el driver awslogs. Escribir a
    # un archivo dentro del contenedor sería tirar los logs a la basura.
    access_log /dev/stdout;
    error_log  /dev/stderr warn;

    sendfile        on;
    keepalive_timeout  65;
    server_tokens   off;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    server {
        listen       8080;
        server_name  _;
        root         /usr/share/nginx/html;
        index        index.html;

        # Healthcheck propio, sin dependencias: tiene que dar 200 aunque el
        # backend esté caído. Si devolviera error, un problema del backend
        # reciclaría también las tareas del frontend y el usuario no vería ni
        # la pantalla de "servicio no disponible".
        location = /salud-frontend {
            access_log off;
            add_header Content-Type application/json;
            return 200 '{"estado":"ok","servicio":"gereo-frontend"}';
        }

        # El HTML se revalida SIEMPRE. Es el archivo que enlaza al resto: si el
        # navegador se queda con una copia vieja, carga módulos JS que ya no
        # existen y la app aparece en blanco después de cada despliegue.
        location = /index.html {
            add_header Cache-Control "no-cache, no-store, must-revalidate";
            add_header Pragma "no-cache";
        }
        location = / {
            add_header Cache-Control "no-cache, no-store, must-revalidate";
            add_header Pragma "no-cache";
            try_files /index.html =404;
        }

        # `no-cache` NO significa "no guardes", significa "preguntá antes de
        # usarlo": con el ETag que nginx ya manda, la respuesta habitual es un
        # 304 sin cuerpo. Se conserva el ahorro de ancho de banda y se elimina
        # el riesgo de servir un .js viejo junto a un index.html nuevo — la
        # mezcla que dejó la app rota tras publicar (ver api/main.py en el
        # backend, que hace exactamente lo mismo en modo local).
        location ~* ^/(css|js|assets)/ {
            add_header Cache-Control "no-cache, must-revalidate";
        }

        # Rutas históricas del logo: existían como endpoints del backend cuando
        # este servía también los estáticos. Se mantienen por si quedó algún
        # enlace o caché apuntando ahí.
        location = /logo                   { try_files /assets/global66-cs-logo.webp =404; }
        location = /global66-cs-logo.webp  { try_files /assets/global66-cs-logo.webp =404; }

        # Una SPA de una sola página: cualquier ruta desconocida es un 404 real,
        # no un fallback a index.html. Si algo pide /generar y llega hasta acá,
        # es que la regla del balanceador está mal y conviene enterarse.
        location / {
            try_files $uri $uri/ =404;
        }
    }
}
